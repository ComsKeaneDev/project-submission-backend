{% extends "base.html" %}

{% block title %}Event Outcomes{% endblock %}

{% block content %}
<div class="info">
    <h1>Event Outcomes</h1>
    <p>Watch the highlights, project demonstrations, and key talks from Access Bristol.</p>

    <div style="margin-top: 2rem; margin-bottom: 3rem;">
        <h2>Event Highlights</h2>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%; margin-bottom: 2rem;">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                src="https://www.youtube.com/embed/cyDEUWVNN4w" 
                title="Access Bristol: Event Outcomes & Highlights" 
                frameborder="0" 
                allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>

        <h2>Project Demonstrations</h2>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none;" 
                src="https://www.youtube.com/embed/XZGZZ-g1GGQ?si=stGsg2TG-p-dFgeZ" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                referrerpolicy="strict-origin-when-cross-origin" 
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <p><em>More videos coming soon!</em></p>
</div>
{% endblock %}
