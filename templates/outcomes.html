{% extends "base.html" %}

{% block title %}Event Outcomes{% endblock %}

{% block content %}
<div class="info">
    <h1>Event Outcomes</h1>
    <p>Watch the highlights, project demonstrations, and key talks from Access Bristol.</p>

    <div style="margin-top: 2rem; margin-bottom: 3rem;">
        <h2>Event Highlights</h2>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                src="https://www.youtube.com/embed/VIDEO_ID_HERE" 
                title="Event Highlights" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <div style="margin-bottom: 3rem;">
        <h2>Keynote Speech: Open Paths Forward</h2>
        <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; max-width: 100%;">
            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                src="https://www.youtube.com/embed/ANOTHER_VIDEO_ID" 
                title="Keynote Speech" frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
        </div>
    </div>
    
    <p><em>More videos coming soon!</em></p>
</div>
{% endblock %}
