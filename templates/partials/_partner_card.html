<article class="partner-card">
  {% if href %}
  <a class="partner-card__link" href="{{ href }}" target="_blank" rel="noopener noreferrer" aria-label="View profile for {{ name }}">
  {% else %}
  <div class="partner-card__link" role="group" aria-label="{{ name }} from {{ org }}">
  {% endif %}

    {% if photo %}
    {# This header is for Organisers with a portrait photo #}
    <header class="partner-card__header">
      <img class="partner-card__avatar"
           src="{{ photo }}"
           alt="Portrait of {{ name }}" width="88" height="88" loading="lazy" />
      <div class="partner-card__title">
        <h3 class="partner-card__name">{{ name }}</h3>
        <div class="partner-card__affil">
          <img class="partner-card__logo"
               src="{{ logo }}"
               alt="{{ org_logo_alt }}" width="22" height="22" loading="lazy" />
          <span class="partner-card__org">{{ org }}</span>
        </div>
      </div>
    </header>
    {% else %}
    {# This header is for Sponsors/Partners with a logo #}
    <header class="partner-card__header">
      <img class="partner-card__avatar"
           style="border-radius: 0.75rem; object-fit: contain; padding: 5px;"
           src="{{ logo }}"
           alt="{{ alt_text }}" width="88" height="88" loading="lazy" />
      <div class="partner-card__title" style="display: flex; align-items: center;">
        <h3 class="partner-card__name">{{ name }}</h3>
      </div>
    </header>
    {% endif %}

    {% if desc %}
      <p class="partner-card__desc">{{ desc }}</p>
    {% endif %}

  {% if href %}</a>{% else %}</div>{% endif %}
</article>
