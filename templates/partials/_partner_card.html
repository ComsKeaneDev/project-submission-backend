<article class="partner-card">
  {% if href %}
  <a class="partner-card__link" href="{{ href }}" aria-label="View partner profile for {{ name }} from {{ org }}">
  {% else %}
  <div class="partner-card__link" role="group" aria-label="{{ name }} from {{ org }}">
  {% endif %}

    <header class="partner-card__header">
      <img class="partner-card__avatar"
           src="{{ photo }}"
           alt="Portrait of {{ name }}" width="88" height="88" loading="lazy" />
      <div class="partner-card__title">
        <h3 class="partner-card__name">{{ name }}</h3>
        <div class="partner-card__affil">
          <img class="partner-card__logo"
               src="{{ logo }}"
               alt="{{ org }} logo" width="22" height="22" loading="lazy" />
          <span class="partner-card__org">{{ org }}</span>
        </div>
      </div>
    </header>

    {% if desc %}
      <p class="partner-card__desc">{{ desc }}</p>
    {% endif %}

  {% if href %}</a>{% else %}</div>{% endif %}
</article>
