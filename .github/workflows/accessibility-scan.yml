name: Accessibility Scan
on:
  workflow_dispatch: # Allows you to run this manually from the Actions tab
  pull_request: # Runs on new pull requests

permissions:
  contents: write # Needed to cache results
  issues: write # Needed to file issues
  pull-requests: write # Needed for Copilot to create PRs

jobs:
  scan:
    name: Run Accessibility Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt #

      - name: Start FastAPI server in background
        run: |
          # Start uvicorn on 127.0.0.1 port 8000 in the background
          uvicorn app.main:app --host 127.0.0.1 --port 8000 & #
          echo "Waiting for server to start..."
          
          # Wait for the server to be ready
          # We'll poll the root URL until it responds
          curl -fsS --retry 25 --retry-delay 1 --retry-all-errors "http://127.0.0.1:8000/" > /dev/null
          echo "Server started!"

      - name: Run Accessibility Scanner
        uses: github/accessibility-scanner@v2 #
        with:
          # A list of URLs from your FastAPI app to scan
          urls: |
            http://127.0.0.1:8000/
            http://127.0.0.1:8000/schedule
            http://127.0.0.1:8000/partners
            http://127.0.0.1:8000/approach
            http://127.0.0.1:8000/what-to-expect
            http://127.0.0.1:8000/faq
            http://127.0.0.1:8000/privacy
          
          # The repo where issues will be filed (your repo)
          repository: comskeanedev/project-submission-backend
          
          # A Personal Access Token (PAT) with write permissions
          # You must create this secret in your repo settings
          token: ${{ secrets.GH_TOKEN }} #
          
          # A key to cache findings between runs
          cache_key: cached_accessibility_results